<div class="p-2 space-y-4 flex flex-col w-full h-full overflow-y-auto">

  <!-- New Messages Section -->
  <div *ngIf="newMessagesFromUsers.length > 0" class="space-y-2 pb-4">
    <h2 class="text-sm text-green-400 pl-1 uppercase tracking-widest">New Messages</h2>
    <div *ngFor="let user of newMessagesFromUsers"
        class="bg-green-900/60 flex flex-row gap-2.5 rounded-lg p-4 shadow hover:bg-green-800 transition w-full">
      <a [routerLink]="['/messages', user.id]"
        class="text-white text-lg font-medium hover:underline flex items-center gap-2">
        <img class="rounded-full h-8 w-8" [src]="user.profile?.avatar" alt="user profile" />
        {{ user.fullname }} <span class="text-sm text-gray-300">({{ user.username }})</span>
      </a>
    </div>
  </div>


  <!-- Followed Users -->
  <div *ngIf="followedUsers.length > 0" class="space-y-2">
    <h2 class="text-sm text-gray-400 pl-1 uppercase tracking-widest">Following</h2>
    <div *ngFor="let user of followedUsers"
         class="bg-gray-800 flex flex-row gap-2.5 rounded-lg p-4 shadow hover:bg-gray-700 transition w-full">
      <a [routerLink]="['/messages', user.id]"
         class="text-white text-lg font-medium hover:underline flex items-center gap-2">
        <img class="rounded-full h-8 w-8" [src]="user.profile?.avatar" alt="user profile" />
        {{ user.fullname }} <span class="text-sm text-gray-400">({{ user.username }})</span>
      </a>
    </div>
  </div>

  <!-- All Other Users -->
  <div *ngIf="otherUsers.length > 0" class="space-y-2 pt-4 border-t border-gray-700">
    <h2 class="text-sm text-gray-400 pl-1 uppercase tracking-widest">Other Users</h2>
    <div *ngFor="let user of otherUsers"
         class="bg-gray-800 flex flex-row gap-2.5 rounded-lg p-4 shadow hover:bg-gray-700 transition w-full">
      <a [routerLink]="['/messages', user.id]"
         class="text-white text-lg font-medium hover:underline flex items-center gap-2">
        <img class="rounded-full h-8 w-8" [src]="user.profile?.avatar" alt="user profile" />
        {{ user.fullname }} <span class="text-sm text-gray-400">({{ user.username }})</span>
      </a>
    </div>
  </div>
</div>
